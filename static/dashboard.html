<!DOCTYPE html>
<html>
<head>
  <title>Task Queue Dashboard</title>
  <style>
    body { font-family: monospace; background: #1a1a1a; color: #e0e0e0; padding: 20px; }
    .stats { display: flex; gap: 20px; margin-bottom: 20px; }
    .stat-box { background: #2a2a2a; padding: 15px 20px; border-radius: 6px; }
    .stat-label { font-size: 12px; color: #888; }
    .stat-value { font-size: 28px; font-weight: bold; }
    .table-container {
    height: 400px;
    overflow-y: auto;
    border: 1px solid #333;
    }
    table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    border: none;
    }
    th, td {
    text-align: left;
    padding: 8px;
    border-bottom: 1px solid #333;
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    }
    th:nth-child(1), td:nth-child(1) { width: 15%; }
    th:nth-child(2), td:nth-child(2) { width: 25%; }
    th:nth-child(3), td:nth-child(3) { width: 25%; }
    th:nth-child(4), td:nth-child(4) { width: 15%; }
    th:nth-child(5), td:nth-child(5) { width: 20%; }
    th { color: #888; }
    .status-done { color: #4ade80; }
    .status-failed, .status-dead { color: #f87171; }
    .status-in_progress { color: #facc15; }
    .status-pending { color: #60a5fa; }
    .status-delayed { color: #ed8b09; }
  </style>
</head>
<body>
  <h2>Task Queue Dashboard</h2>
  <div class="stats" id="stats"></div>
  <h3>Recent Jobs</h3>
  <table>
    <thead>
        <tr><th>ID</th><th>Type</th><th>Priority</th><th>Attempts</th><th>Status</th></tr>
    </thead>
    <tbody id="jobs"></tbody>
    </table>
  <h3>Scheduler / Reaper Log <button onclick="clearLogs()" style="font-size:11px; margin-left:10px;">Clear</button> </h3>
  <pre id="logs" style="background:#111; padding:10px; height:200px; overflow-y:auto; font-size:12px;"></pre>

  <script>
    const API = "http://localhost:8000";

    async function refresh() {
      const stats = await fetch(`${API}/stats`).then(r => r.json());
      document.getElementById("stats").innerHTML = Object.entries(stats).map(([k, v]) => `
        <div class="stat-box">
          <div class="stat-label">${k}</div>
          <div class="stat-value">${v}</div>
        </div>
      `).join("");
      const logs = await fetch(`${API}/logs`).then(r => r.json());
      document.getElementById("logs").textContent = logs.join("\n");

      const jobs = await fetch(`${API}/jobs?limit=20`).then(r => r.json());
      document.getElementById("jobs").innerHTML = jobs.map(j => `
        <tr>
          <td>${j.id.slice(0, 8)}</td>
          <td>${j.type}</td>
          <td>${j.priority || "low"}</td>
          <td>${j.attempts}/${j.max_attempts}</td>
          <td class="status-${j.status}">${j.status}</td>
        </tr>
      `).join("");
    }

    async function clearLogs() {
        await fetch(`${API}/logs`, { method: "DELETE" });
        refresh();
    }

    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
